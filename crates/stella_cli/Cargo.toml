[package]
name = "stella_cli"
version = "0.1.0"
edition = "2021"
authors = ["Seuriin (SSL-ACTX) <seuriin@gmail.com>"]
license = "AGPL-3.0-only"
repository = "https://github.com/SSL-ACTX/stella"
description = "Command-line interface and runtime engine for Stella"

[[bin]]
name = "stella"
path = "src/main.rs"

[dependencies]
stella_core = { path = "../stella_core" }
stella_compiler = { path = "../stella_compiler" }
stella_gpu = { path = "../stella_gpu", default-features = false }
clap = { version = "4.6", features = ["derive", "color", "help"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }

[target.'cfg(target_os = "android")'.dependencies]
radb = { package = "ruri", git = "https://github.com/SSL-ACTX/ruri" }

[features]
default = []
gpu = ["stella_gpu/gpu"]
