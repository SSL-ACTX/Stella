[package]
name = "stella_cli"
version = "0.2.0"
edition = "2021"
description = "Command-line frontend for Project Stella"

[[bin]]
name = "stella"
path = "src/main.rs"

[dependencies]
stella_core = { path = "../stella_core" }
stella_compiler = { path = "../stella_compiler" }
stella_gpu = { path = "../stella_gpu" }
clap = { version = "4.6", features = ["derive", "color", "help"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }

[target.'cfg(target_os = "android")'.dependencies]
radb = { package = "ruri", git = "https://github.com/SSL-ACTX/ruri" }
