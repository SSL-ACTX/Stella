[package]
name = "stella_frontend"
version = "0.1.0"
edition = "2021"
description = "Language frontend, AST, lexer, arena bump parser and symbol resolution for Stella Synaptic DSL"

[dependencies]
bumpalo = { version = "3.20", default-features = false }
pest = "2.7"
pest_derive = "2.7"

[features]
default = ["std"]
std = ["pest/std"]

